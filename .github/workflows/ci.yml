name: CI
on:
  push: { branches: [main, develop] }
  pull_request:
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Estilo (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Tipos (mypy strict)
        run: MYPYPATH=src mypy -p ecotrack
      - name: Testes
        run: pytest --cov=src/ecotrack --cov-report=term-missing
  integracao-mongo:
    runs-on: ubuntu-latest
    needs: qualidade
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar mongosh
        run: |
          wget -qO- https://www.mongodb.org/static/pgp/server-8.0.asc | sudo tee /etc/apt/trusted.gpg.d/mongodb.asc
          echo "deb https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb.list
          sudo apt-get update && sudo apt-get install -y mongodb-mongosh
      - name: Criar colecoes, popular e consultar
        run: |
          mongosh mongodb://localhost:27017 database/01_criar_colecoes.js
          mongosh mongodb://localhost:27017 database/02_popular_dados.js
          mongosh mongodb://localhost:27017 database/03_consultas_analiticas.js
          mongosh mongodb://localhost:27017 database/04_rotinas_consistencia.js
